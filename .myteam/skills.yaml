# myteam MVP 技能清单
# 这个文件只描述“什么技能适合交给哪些 agent”，不包含密钥。
# 后续可以把这里升级成真正的按需提示词加载系统。

skills:
  - name: task-planning
    category: planning
    trigger: 用户输入目标，需要拆成可验收任务
    description: 把目标拆成 3-7 个小任务，并写清步骤、验收标准和建议 agent。
    mounts:
      controller: true
      worker: false
      reviewer: false
      codex: true
      claude: true
      kimi: true

  - name: cli-execution
    category: execution
    trigger: 需要调用本机 CLI、执行任务或保存运行记录
    description: 调用可启动的 agent CLI，记录 stdout、stderr、状态和失败原因。
    mounts:
      controller: false
      worker: true
      reviewer: false
      codex: true
      claude: true
      kimi: true

  - name: review-gate
    category: quality
    trigger: worker 输出完成后，需要判断是否真的通过验收
    description: 检查任务输出、证据、风险和缺口；不通过时生成返工建议。
    mounts:
      controller: true
      worker: false
      reviewer: true
      codex: true
      claude: true
      kimi: false

  - name: lesson-capture
    category: memory
    trigger: 任务失败、返工或出现新的踩坑经验
    description: 把失败原因转成结构化 lessons，只把确认过的经验写入长期记忆。
    mounts:
      controller: true
      worker: false
      reviewer: true
      codex: true
      claude: true
      kimi: true

  - name: html-ui-alignment
    category: frontend
    trigger: 对比 clowder-ai 和 myteam 的 HTML、交互或信息架构
    description: 识别 Hub、任务面板、消息操作、状态提示等 UI 差距，并提出 MVP 可落地改动。
    mounts:
      controller: true
      worker: true
      reviewer: true
      codex: true
      claude: true
      kimi: true
