<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 420px; height: 280px;
    background: linear-gradient(135deg, #1a1510 0%, #2a1f15 100%);
    color: #e8dcc8;
    font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .logo {
    width: 56px; height: 56px;
    background: #c96a2a;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: white;
    margin-bottom: 16px;
    box-shadow: 0 4px 20px rgba(201, 106, 42, 0.4);
  }
  .title {
    font-size: 18px; font-weight: 600;
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 12px; opacity: 0.6;
    margin-bottom: 24px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid rgba(232, 220, 200, 0.2);
    border-top-color: #c96a2a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  .status {
    font-size: 13px; opacity: 0.7;
    min-height: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">M</div>
  <div class="title">myteam</div>
  <div class="subtitle">A2A 协作控制台</div>
  <div class="spinner"></div>
  <div class="status" id="status">正在初始化…</div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (e, msg) => {
      document.getElementById('status').textContent = msg;
    });
  </script>
</body>
</html>
