<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>myteam · A2A 控制台</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ── topbar (简化) ── -->
<div class="topbar">
  <div class="logo">myteam <span class="logo-sub">A2A 控制台</span></div>
  <div class="agent-pills" id="agentPills">
    <span class="agent-pill"><span class="dot"></span>连接中…</span>
  </div>
  <button class="hub-btn" id="hubBtn" title="打开 Hub">Hub</button>
  <button class="settings-btn" id="settingsBtn" title="Agent 配置">⚙</button>
</div>

<!-- Session 新建表单（弹层） -->
<div class="session-new-form hidden" id="sessionNewForm">
  <input type="text" id="sessionNameInput" placeholder="对话名称" value="">
  <button class="confirm-btn" id="sessionNewConfirm">创建</button>
  <button class="cancel-btn" id="sessionNewCancel">取消</button>
</div>

<!-- ── Agent 管理抽屉 ── -->
<div class="drawer-mask hidden" id="drawerMask"></div>
<div class="drawer hidden" id="settingsDrawer">
  <div class="drawer-header">
    <span class="drawer-title">⚙ Agent 配置</span>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-body">
    <p class="drawer-desc">修改 CLI 可执行文件路径，保存后立即生效（写回本机 .env，不会上传 GitHub）。</p>
    <div class="agent-form" id="agentForm"><!-- 动态生成 --></div>
    <div class="drawer-actions">
      <button class="drawer-save-btn" id="drawerSaveBtn">💾 保存配置</button>
      <span class="drawer-save-tip hidden" id="drawerSaveTip"></span>
    </div>
  </div>
</div>

<!-- ── Hub 指挥抽屉 ── -->
<div class="drawer-mask hidden" id="hubMask"></div>
<div class="hub-drawer hidden" id="hubDrawer">
  <div class="drawer-header">
    <div>
      <span class="drawer-title">myteam Hub</span>
      <div class="hub-subtitle">轻量 A2A 指挥中心</div>
    </div>
    <button class="drawer-close" id="hubClose">✕</button>
  </div>
  <div class="hub-tabs" id="hubTabs">
    <button class="hub-tab active" data-tab="overview">总览</button>
    <button class="hub-tab" data-tab="agents">Agent</button>
    <button class="hub-tab" data-tab="skills">Skills</button>
    <button class="hub-tab" data-tab="invocations">调用</button>
    <button class="hub-tab" data-tab="gate">Gate</button>
    <button class="hub-tab" data-tab="tasks">任务</button>
  </div>
  <div class="hub-body" id="hubBody">
    <div class="hub-loading">正在读取本地状态…</div>
  </div>
</div>

<div class="layout" id="layout">
  <!-- ── 左侧 Session sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">对话</span>
      <button class="sidebar-toggle" id="sidebarToggle" title="折叠/展开">‹</button>
    </div>
    <div class="sidebar-list" id="sessionList">
      <!-- 动态生成 session 项目 -->
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-new-btn" id="sidebarNewBtn">＋ <span>新建对话</span></button>
    </div>
  </aside>

  <!-- ── 聊天区 ── -->
  <div class="chat-area">
    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome" id="chatWelcome">
        <div class="emoji">🤝</div>
        <h2>欢迎来到 myteam</h2>
        <p>直接发消息和 agent 对话，用 <code style="background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px;">@claude</code>、<code style="background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px;">@codex</code> 或 <code style="background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px;">@kimi</code> 指定 agent。<br>切换到「拆任务」模式可以把目标分解成可执行清单。</p>
      </div>
    </div>

    <div class="chat-input-area">
      <!-- 模式切换 -->
      <div class="options-row">
        <span class="options-label">模式：</span>
        <div class="radio-group" id="modeGroup">
          <div class="radio-btn active" data-value="chat">💬 对话</div>
          <div class="radio-btn" data-value="plan">📋 拆任务</div>
        </div>
        <!-- plan 模式下显示 agent 选择 -->
        <span class="options-label hidden" id="planAgentLabel" style="margin-left:8px;">Agent：</span>
        <div class="radio-group hidden" id="planAgentGroup"></div>
        <button class="dispatch-btn hidden" id="dispatchBtn" disabled>
          <span id="dispatchSpinner" class="spinner hidden"></span>
          ▶ 执行 pending 任务
        </button>
      </div>
      <!-- @mention 提示条 -->
      <div id="mentionHint" class="mention-hint hidden"></div>
      <div class="input-row">
        <textarea
          class="goal-input"
          id="goalInput"
          rows="1"
          placeholder="输入消息，或用 @claude / @codex / @kimi 指定 agent…"
        ></textarea>
        <button class="send-btn" id="sendBtn" title="发送">➤</button>
        <button class="stop-btn hidden" id="stopBtn" title="停止">■</button>
      </div>
    </div>
  </div>

  <!-- ── 任务面板（默认收起为窄条） ── -->
  <div class="tasks-panel">
    <!-- 收起态：竖向窄条 -->
    <div class="tasks-rail">
      <button class="tasks-rail-toggle" id="tasksExpandBtn" title="展开任务面板">📋</button>
      <span class="tasks-rail-count" id="tasksRailCount">0</span>
      <span class="tasks-rail-label">任务</span>
    </div>
    <!-- 展开态 -->
    <div class="tasks-expanded-content">
      <div class="tasks-header">
        <span>任务列表 <span class="tasks-count hidden" id="tasksCount">0</span></span>
        <div class="tasks-header-actions">
          <button class="tasks-collapse-btn" id="tasksCollapseBtn" title="收起">›</button>
        </div>
      </div>
      <div class="tasks-filter-bar">
        <input type="text" id="tasksSearch" placeholder="搜索任务..." class="tasks-search-input">
        <div class="tasks-filter-chips">
          <button class="filter-chip active" data-filter="all">全部</button>
          <button class="filter-chip" data-filter="pending">待执行</button>
          <button class="filter-chip" data-filter="in_progress">执行中</button>
          <button class="filter-chip" data-filter="done">已完成</button>
          <button class="filter-chip" data-filter="failed">失败</button>
        </div>
      </div>
      <div class="tasks-list" id="tasksList">
        <div class="tasks-empty">暂无任务</div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
